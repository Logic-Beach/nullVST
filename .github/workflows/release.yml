name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            file: macOS
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          - label: Windows x64
            os: windows-latest
            file: Windows-x64
            cmake_args: ""
          - label: Linux x64
            os: ubuntu-latest
            file: Linux-x64
            cmake_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgtk-3-dev zip

      - name: Configure and build
        shell: bash
        env:
          CMAKE_EXTRA: ${{ matrix.cmake_args }}
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $CMAKE_EXTRA
          cmake --build build --config Release --parallel

      - name: Package the VST3
        shell: bash
        run: |
          set -euo pipefail
          ART=$(find build -type d -name "NullAtomo.vst3" -print -quit)
          test -n "$ART"
          mkdir -p dist
          NAME="NullAtomo-${GITHUB_REF_NAME}-${{ matrix.file }}.zip"
          OUT="$PWD/dist/$NAME"
          PARENT=$(dirname "$ART")
          # GNU tar cannot write zip. bsdtar (macOS and Windows) can.
          if tar --version 2>/dev/null | head -1 | grep -q 'GNU tar'; then
            (cd "$PARENT" && zip -r -y "$OUT" "NullAtomo.vst3")
          else
            tar -a -cf "$OUT" -C "$PARENT" "NullAtomo.vst3"
          fi
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/*.zip

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh dist
          NOTES=$(cat <<EOF
          NullAtomo ${GITHUB_REF_NAME} is a VST3 instrument.

          ## Downloads
          - macOS (11 or newer): one plugin for Apple Silicon and Intel.
          - Windows (10 or newer): 64-bit.
          - Linux: x86_64.

          ## Install
          Unzip and move NullAtomo.vst3 into the host VST3 folder.
          - macOS: ~/Library/Audio/Plug-Ins/VST3/  (Reason also scans ~/Library/Audio/Plug-Ins/VST/)
          - Windows: C:/Program Files/Common Files/VST3/
          - Linux: ~/.vst3/

          The macOS build is not notarized. If macOS blocks it after download, clear the quarantine flag on the unzipped plugin:

          xattr -dr com.apple.quarantine "/path/to/NullAtomo.vst3"

          eSpeak NG 1.52.0 is included and is licensed under GPL-3.0. The source for this build is the ${GITHUB_REF_NAME} tag.
          EOF
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --title "NullAtomo ${GITHUB_REF_NAME}" \
              --notes "$NOTES"
          fi
